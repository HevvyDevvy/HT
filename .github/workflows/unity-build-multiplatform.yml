name: Unity Multi-Platform Build

# Run "Bootstrap Unity Project" once first (see bootstrap-unity-project.yml) —
# this workflow needs a real Unity project (ProjectSettings) to already exist
# in the repo, which that one-time job generates.
#
# REALISTIC EXPECTATIONS, stated plainly:
#   - Android: builds a real .apk here, downloadable from this workflow's
#     Artifacts, and installable directly on an Android phone by enabling
#     "install unknown apps" for your browser/files app. This is the ONE
#     target you can fully build AND actually play using only a phone +
#     GitHub — no other device needed.
#   - Windows / macOS: this builds real executables, but you need an actual
#     Windows or Mac machine to run them — GitHub can build them, it can't
#     run/play them for you, and neither can a phone.
#   - iOS: this produces an Xcode project, not an installable app. Getting
#     it onto an iPhone additionally requires a Mac (for Xcode signing) and
#     an Apple Developer account. There's no way around that one — it's an
#     Apple platform restriction, not a tooling gap.
#
# Same secrets as the bootstrap workflow: UNITY_EMAIL, UNITY_PASSWORD.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "client-unity/Assets/**"
      - "client-unity/ProjectSettings/**"

jobs:
  build:
    name: Build for ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - Android
          - StandaloneWindows64
          - StandaloneOSX

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: client-unity/Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('client-unity/Assets/**') }}
          restore-keys: Library-${{ matrix.targetPlatform }}-

      - name: Build Unity project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client-unity
          targetPlatform: ${{ matrix.targetPlatform }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}

  # iOS builds need a macOS runner and Apple signing setup, which is a
  # separate step once you actually have a Mac + Apple Developer account
  # available — not something worth wiring up before you can test it.
